<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias — Recursos Humanos</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    header { background: #1b232e !important; border-color: #2b3644 !important; }
    .tabs { background: #1b232e !important; border-color: #2b3644 !important; }
    .tab { color: #9fb0c3 !important; }
    .tab.activa { background: #253040 !important; color: #e8eef5 !important; }
    .tarjeta { background: #1b232e !important; border-color: #2b3644 !important; }
    input, textarea { background: #121820 !important; border-color: #3a4657 !important; color: #e8eef5 !important; }
    .vacio { color: #9fb0c3 !important; }
  }
  header {
    background: #fff; border-bottom: 1px solid #dde3ea;
    padding: 28px 20px; text-align: center;
  }
  h1 { font-size: clamp(22px, 5vw, 30px); margin: 0 0 10px; }
  .intro {
    margin: 0 auto; max-width: 480px;
    font-size: 16px; line-height: 1.55; opacity: .85;
  }
  main { padding: 24px 16px 40px; max-width: 560px; margin: 0 auto; }

  .tabs {
    display: flex; gap: 4px;
    background: #fff; border: 1px solid #dde3ea; border-radius: 12px;
    padding: 4px; margin-bottom: 20px;
  }
  .tab {
    flex: 1; border: none; background: transparent; cursor: pointer;
    padding: 10px 8px; border-radius: 9px;
    font-size: 15px; font-family: inherit; color: #5a6674;
  }
  .tab.activa { background: #eef2f6; color: #1a2027; font-weight: 600; }

  .vista { display: none; }
  .vista.activa { display: block; }

  .tarjeta {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 18px; margin-bottom: 14px;
  }
  .tarjeta h3 { margin: 0 0 4px; font-size: 17px; }
  .tarjeta .persona { font-size: 13px; opacity: .7; margin: 0 0 10px; }
  .tarjeta .justificacion { margin: 0 0 14px; line-height: 1.5; font-size: 15px; }
  .fila-voto { display: flex; align-items: center; gap: 12px; }
  .btn-votar {
    border: 1px solid #2f6fed; background: #2f6fed; color: #fff;
    border-radius: 9px; padding: 8px 16px; font-size: 14px; font-family: inherit;
    cursor: pointer;
  }
  .btn-votar:disabled { opacity: .5; cursor: default; }
  .conteo-votos { font-size: 14px; opacity: .75; }

  .vacio {
    text-align: center; color: #5a6674; font-size: 15px;
    padding: 30px 10px;
  }

  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 14px; font-weight: 600; }
  input, textarea {
    width: 100%; font-family: inherit; font-size: 16px;
    padding: 10px 12px; border-radius: 9px; border: 1px solid #c3ccd6;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 80px; }
  .btn-enviar {
    border: none; background: #2f6fed; color: #fff;
    border-radius: 9px; padding: 12px 16px; font-size: 16px; font-family: inherit;
    cursor: pointer;
  }
  .btn-enviar:disabled { opacity: .6; }
  .mensaje-estado { font-size: 14px; margin: 0; }
  .mensaje-estado.ok { color: #1a7a3c; }
  .mensaje-estado.error { color: #c0392b; }
</style>
</head>
<body>
  <header>
    <h1>Buzón de sugerencias — Recursos Humanos</h1>
    <p class="intro">
      Un espacio para que cualquier persona del área deje una idea, queja
      o propuesta de mejora, de forma simple y directa.
    </p>
  </header>
  <main>
    <div class="tabs">
      <button class="tab activa" data-vista="ver">Ver propuestas</button>
      <button class="tab" data-vista="proponer">Proponer un lugar</button>
    </div>

    <section id="vista-ver" class="vista activa">
      <div id="lista-propuestas"></div>
    </section>

    <section id="vista-proponer" class="vista">
      <form id="form-propuesta">
        <div>
          <label for="lugar">Lugar</label>
          <input id="lugar" name="lugar" type="text" required maxlength="120">
        </div>
        <div>
          <label for="persona">Tu nombre</label>
          <input id="persona" name="persona" type="text" required maxlength="80">
        </div>
        <div>
          <label for="justificacion">¿Por qué ese lugar?</label>
          <textarea id="justificacion" name="justificacion" required maxlength="400"></textarea>
        </div>
        <button class="btn-enviar" type="submit">Enviar propuesta</button>
        <p id="estado-form" class="mensaje-estado"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("activa"));
        document.querySelectorAll(".vista").forEach((v) => v.classList.remove("activa"));
        tab.classList.add("activa");
        document.getElementById("vista-" + tab.dataset.vista).classList.add("activa");
      });
    });

    const SUPABASE_URL = "https://nyaxlmtrzfydmgynbwzd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Dj28uSgI_xqB0cICa7Tr7g_jVylICk-";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CLAVE_VOTOS = "cena_votos_emitidos";
    function votosEmitidos() {
      try { return JSON.parse(localStorage.getItem(CLAVE_VOTOS) || "[]"); }
      catch { return []; }
    }
    function marcarVotado(id) {
      const votos = votosEmitidos();
      votos.push(id);
      localStorage.setItem(CLAVE_VOTOS, JSON.stringify(votos));
    }

    function escaparHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    async function cargarPropuestas() {
      const contenedor = document.getElementById("lista-propuestas");
      const { data: propuestas, error } = await supabase
        .from("propuestas_cena")
        .select("id, lugar, persona, justificacion, created_at")
        .order("created_at", { ascending: true });

      if (error) {
        contenedor.innerHTML = '<p class="vacio">No se pudieron cargar las propuestas todavía.</p>';
        return;
      }
      if (!propuestas || propuestas.length === 0) {
        contenedor.innerHTML = '<p class="vacio">Todavía no hay ninguna propuesta.</p>';
        return;
      }

      const { data: votos, error: errorVotos } = await supabase
        .from("votos_cena")
        .select("propuesta_id");

      const conteos = {};
      if (!errorVotos && votos) {
        for (const v of votos) {
          conteos[v.propuesta_id] = (conteos[v.propuesta_id] || 0) + 1;
        }
      }

      const yaVotadas = new Set(votosEmitidos());

      contenedor.innerHTML = propuestas.map((p) => {
        const votosCount = conteos[p.id] || 0;
        const yaVoto = yaVotadas.has(p.id);
        return `
          <div class="tarjeta">
            <h3>${escaparHtml(p.lugar)}</h3>
            <p class="persona">Propuesto por ${escaparHtml(p.persona)}</p>
            <p class="justificacion">${escaparHtml(p.justificacion)}</p>
            <div class="fila-voto">
              <button class="btn-votar" data-id="${p.id}" ${yaVoto ? "disabled" : ""}>
                ${yaVoto ? "Ya votaste" : "Votar"}
              </button>
              <span class="conteo-votos">${votosCount} voto${votosCount === 1 ? "" : "s"}</span>
            </div>
          </div>
        `;
      }).join("");

      contenedor.querySelectorAll(".btn-votar").forEach((boton) => {
        boton.addEventListener("click", async () => {
          const id = Number(boton.dataset.id);
          boton.disabled = true;
          const { error: errorVoto } = await supabase
            .from("votos_cena")
            .insert({ propuesta_id: id });
          if (!errorVoto) {
            marcarVotado(id);
            cargarPropuestas();
          } else {
            boton.disabled = false;
          }
        });
      });
    }

    document.getElementById("form-propuesta").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const form = evento.target;
      const boton = form.querySelector(".btn-enviar");
      const estado = document.getElementById("estado-form");
      boton.disabled = true;
      estado.textContent = "";
      estado.className = "mensaje-estado";

      const { error } = await supabase.from("propuestas_cena").insert({
        lugar: form.lugar.value.trim(),
        persona: form.persona.value.trim(),
        justificacion: form.justificacion.value.trim(),
      });

      boton.disabled = false;
      if (error) {
        estado.textContent = "Algo falló, intenta de nuevo.";
        estado.className = "mensaje-estado error";
      } else {
        estado.textContent = "¡Gracias! Tu propuesta ya quedó registrada.";
        estado.className = "mensaje-estado ok";
        form.reset();
        cargarPropuestas();
      }
    });

    cargarPropuestas();
  </script>
</body>
</html>
