<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias — Recursos Humanos</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    header { background: #1b232e !important; border-color: #2b3644 !important; }
    .placeholder { background: #1b232e !important; border-color: #3a4657 !important; color: #9fb0c3 !important; }
  }
  header {
    background: #fff; border-bottom: 1px solid #dde3ea;
    padding: 28px 20px; text-align: center;
  }
  h1 { font-size: clamp(22px, 5vw, 30px); margin: 0 0 10px; }
  .intro {
    margin: 0 auto; max-width: 480px;
    font-size: 16px; line-height: 1.55; opacity: .85;
  }
  main { padding: 24px 20px 40px; }
  .placeholder {
    max-width: 480px; margin: 0 auto;
    background: #eef2f6; border: 2px dashed #c3ccd6; border-radius: 14px;
    padding: 40px 20px; text-align: center;
    color: #5a6674; font-size: 15px; line-height: 1.5;
  }
</style>
</head>
<body>
  <header>
    <h1>Buzón de sugerencias — Recursos Humanos</h1>
    <p class="intro">
      Un espacio para que cualquier persona del área deje una idea, queja
      o propuesta de mejora, de forma simple y directa.
    </p>
  </header>
  <main>
    <div class="placeholder">
      Aquí va a ir el formulario para dejar una sugerencia.
    </div>
  </main>
</body>
</html>
